<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto</title>
  <link rel="stylesheet" href="css/contacto.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="imagenes/logo/logo.png">

</head>
<style>
        .navbar {
            background-color: #222;
            padding: 17px 3;
            display: flex;
            justify-content: center; /* Centra horizontalmente */
            align-items: center;     /* Centra verticalmente si hay más contenido */
        }
        .logo {
            color: rgb(255, 255, 255);
            font-size: 40px;
            font-weight: bold;
        }
        .boton-salir {
            position:absolute;
            top: 20px;
            right: 30px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .boton-salir:hover {
            background-color: #e7e40b;
        }

        .boton-salir i {
            margin-right: 6px;
        }     
</style>
<body>

    <nav class="navbar">
        <div class="logo">STYLEX</div>
    </nav>

  <section class="seccion-contacto container">
    <h2 class="mb-4">Contáctanos</h2>
    <hr>
    <div class="row mt-4">
      <!-- Formulario -->
      <div class="col-md-6">
        <h3 class="fw-bold">¿Tienes preguntas?<br>Escríbenos directamente a nuestra pagina tu mensaje</h3>
        <p class="descripcion">Rellena el siguiente formulario y te responderemos lo antes posible.</p>
        <form class="formulario-contacto">
          <input type="text" class="form-control" placeholder="Tu nombre" required>
          <input type="email" class="form-control" placeholder="Tu correo electrónico" required>
          <textarea class="form-control" rows="4" placeholder="Tu mensaje..." required></textarea>
          <button class="boton-principal mt-2" type="submit">Enviar mensaje</button>
        </form>
      </div>

      <!-- Información de contacto -->
      <div class="col-md-6">
        <div class="row mb-4">
          <div class="col-6">
            <div class="icono">📍</div>
            <h5 class="titulo-seccion">Ubicación</h5>
            <p class="descripcion">Av. Principal 123, X, Perú</p>
          </div>
          <div class="col-6">
            <div class="icono">📞</div>
            <h5 class="titulo-seccion">Teléfono</h5>
            <p class="descripcion">+51 987 654 321</p>
          </div>
        </div>
        <div class="row">
          <div class="col-6">
            <div class="icono">📧</div>
            <h5 class="titulo-seccion">Correo</h5>
            <p class="descripcion">Stylex@ejemplo.com</p>
          </div>
          <div class="col-6">
            <div class="icono">⏰</div>
            <h5 class="titulo-seccion">Horario</h5>
            <p class="descripcion">Lun - Vie: 8am - 6pm</p>
          </div>
        </div>
      </div>
    </div>
  </section>
    <button class="boton-salir" onclick="location.href='index.html';">
  <i class="fa-solid fa-right-from-bracket"></i></button>
</body>
</html>
